        <h1 id="ending-title">长梦未醒</h1>
        <div class="ending-divider" aria-hidden="true"><span></span></div>
        <p class="ending-copy">
          旧井突然坍塌，大家都惊醒了，围绕在旧井中，众人把碎石移开却没有看到任何东西。你抬头却和玄濯真人视线撞上，他脸上没有半分阵法被破坏的愤怒，没有任何表情。你甚至觉得和温照夜在井下的经历只是一场梦，如果你手里没有握着那半张符箓的话。无人揭穿玄濯的阴谋，他依旧开着行照堂，只是去的人越来越多。你向白蘅和陆栖尘求助，他们却冷漠地看着你，提起温照夜，他们只是说，温照夜偷了玄濯真人的东西被除名已经算是最轻的惩罚了，至于其他生死有命。你慢慢也认命，一天夜里，你准备就寝，神识一痛，便永远失去了意识......
        </p>
        <p class="ending-note">井下无人归来，山门照旧开合。</p>
