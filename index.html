<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/branding/favicon.svg" type="image/svg+xml" />
    <title>青灯未归 | 青岚宗外门事务处</title>
    <meta
      name="description"
      content="《青灯未归》第一阶段原型：通过检索宗门卷宗，逐步解开青岚宗外门事务处隐去的记录。"
    />
    <style>
      :root {
        --ink: #221d19;
        --ink-soft: #544941;
        --teal-900: #112c31;
        --teal-800: #193940;
        --teal-700: #254850;
        --gold: #b99352;
        --gold-soft: rgba(185, 147, 82, 0.24);
        --border: rgba(121, 97, 54, 0.26);
        --paper: rgba(250, 245, 233, 0.9);
        --shadow-soft: 0 12px 28px rgba(33, 29, 25, 0.08);
        --shadow: 0 20px 42px rgba(33, 29, 25, 0.14);
        --radius-lg: 28px;
        --radius-md: 20px;
        --content-width: 1240px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(193, 211, 205, 0.28), transparent 24%),
          radial-gradient(circle at 80% 18%, rgba(123, 140, 135, 0.2), transparent 18%),
          linear-gradient(180deg, #f5eee2 0%, #ece2d0 56%, #e7ddcd 100%);
        font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
        line-height: 1.72;
      }

      body.has-overlay {
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(86, 64, 38, 0.014) 0,
            rgba(86, 64, 38, 0.014) 1px,
            transparent 1px,
            transparent 5px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(86, 64, 38, 0.012) 0,
            rgba(86, 64, 38, 0.012) 1px,
            transparent 1px,
            transparent 7px
          );
        opacity: 0.52;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid rgba(206, 178, 124, 0.22);
        background:
          linear-gradient(180deg, rgba(12, 31, 35, 0.95), rgba(18, 43, 48, 0.92)),
          linear-gradient(
            90deg,
            rgba(185, 147, 82, 0.12),
            transparent 25%,
            transparent 75%,
            rgba(185, 147, 82, 0.12)
          );
        backdrop-filter: blur(12px);
        box-shadow: 0 12px 24px rgba(15, 23, 25, 0.18);
      }

      .header-inner,
      .app-shell,
      .footer-inner {
        width: min(calc(100% - 40px), var(--content-width));
        margin: 0 auto;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 16px 0;
      }

      .brand-lockup {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 0;
        border: 0;
        color: #f2e9d6;
        background: transparent;
      }

      .brand-seal {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border: 1px solid rgba(201, 166, 100, 0.64);
        border-radius: 50%;
        color: #d9ba7d;
        font-family: "STKaiti", "KaiTi", serif;
        font-size: 1.4rem;
        box-shadow: inset 0 0 0 4px rgba(201, 166, 100, 0.12);
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .brand-overline {
        color: rgba(232, 215, 180, 0.76);
        font-size: 0.76rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .brand-title {
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: 1.3rem;
        letter-spacing: 0.06em;
      }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 999px;
        color: rgba(249, 241, 225, 0.92);
        background: transparent;
        text-decoration: none;
        transition: border-color 180ms ease, background-color 180ms ease, color 180ms ease;
      }

      .nav-link:hover,
      .nav-link:focus-visible {
        border-color: rgba(205, 171, 108, 0.42);
        background: rgba(205, 171, 108, 0.08);
        color: #fff7e7;
        outline: none;
      }

      .app-shell {
        padding: 28px 0 36px;
      }

      .hero-grid,
      .content-grid {
        display: grid;
        gap: 22px;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1.34fr) minmax(320px, 0.86fr);
        align-items: stretch;
      }

      .content-grid {
        grid-template-columns: minmax(0, 1.26fr) minmax(300px, 0.78fr);
        margin-top: 22px;
      }

      .paper-panel {
        position: relative;
        overflow: hidden;
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background:
          linear-gradient(180deg, rgba(255, 253, 248, 0.68), rgba(248, 240, 225, 0.9)),
          linear-gradient(120deg, rgba(202, 183, 144, 0.08), transparent 45%);
        box-shadow: var(--shadow-soft);
        animation: panel-fade 420ms ease both;
      }

      .paper-panel::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(184, 148, 87, 0.16);
        border-radius: calc(var(--radius-lg) - 10px);
        pointer-events: none;
      }

      .hero-card {
        min-height: 350px;
        background:
          radial-gradient(circle at 14% 18%, rgba(104, 130, 127, 0.18), transparent 26%),
          radial-gradient(circle at 84% 25%, rgba(88, 101, 108, 0.2), transparent 18%),
          linear-gradient(180deg, rgba(255, 252, 246, 0.7), rgba(245, 235, 218, 0.94)),
          linear-gradient(120deg, rgba(203, 179, 136, 0.1), transparent 45%);
      }

      .hero-card::after {
        content: "";
        position: absolute;
        inset: auto 0 0 0;
        height: 34%;
        background:
          radial-gradient(circle at 18% 65%, rgba(58, 79, 84, 0.18), transparent 20%),
          radial-gradient(circle at 38% 78%, rgba(61, 82, 87, 0.15), transparent 18%),
          radial-gradient(circle at 74% 70%, rgba(77, 88, 91, 0.16), transparent 18%),
          linear-gradient(180deg, transparent, rgba(69, 82, 88, 0.08));
        filter: blur(8px);
        opacity: 0.9;
        pointer-events: none;
      }

      .protocol-card,
      .watch-card {
        background:
          linear-gradient(180deg, rgba(252, 248, 238, 0.78), rgba(242, 232, 212, 0.95)),
          linear-gradient(140deg, rgba(179, 149, 93, 0.12), transparent 48%);
      }

      .panel-kicker,
      .hero-overline {
        margin: 0 0 10px;
        color: #8a6a3d;
        font-size: 0.82rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .hero-card h1,
      .record-header h1 {
        margin: 0;
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: clamp(2.2rem, 4.6vw, 4.6rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        line-height: 1.1;
      }

      .hero-copy {
        max-width: 720px;
        margin: 16px 0 24px;
        color: var(--ink-soft);
        font-size: 1.02rem;
      }

      .panel-heading h2,
      .search-panel h3,
      .directory-copy h3,
      .record-body h2,
      .section-title h2 {
        margin: 0;
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        letter-spacing: 0.06em;
      }

      .panel-heading h2,
      .record-body h2 {
        font-size: 1.46rem;
      }

      .search-panel h3,
      .directory-copy h3 {
        font-size: 1.42rem;
      }

      .section-title h2 {
        font-size: 1.72rem;
      }

      .protocol-list {
        margin: 18px 0 0;
        padding-left: 20px;
        color: var(--ink-soft);
      }

      .protocol-list li {
        margin-bottom: 12px;
      }

      .search-panel {
        max-width: 740px;
        margin-top: 24px;
        padding: 20px;
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(253, 249, 239, 0.92), rgba(246, 236, 218, 0.96)),
          linear-gradient(140deg, rgba(173, 144, 84, 0.12), transparent 48%);
      }

      .search-panel.is-compact {
        max-width: none;
        margin-top: 22px;
      }

      .search-form {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      .search-form input {
        flex: 1;
        min-width: 0;
        padding: 14px 18px;
        border: 1px solid rgba(89, 81, 65, 0.18);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 252, 246, 0.88);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .search-form input:focus-visible {
        outline: 2px solid rgba(136, 102, 42, 0.24);
        border-color: rgba(136, 102, 42, 0.34);
      }

      .search-form button,
      .footer-home-button {
        padding: 14px 24px;
        border: 1px solid rgba(155, 118, 53, 0.42);
        border-radius: 999px;
        color: #fff8e6;
        background:
          linear-gradient(180deg, #224148, #173238),
          linear-gradient(90deg, rgba(196, 157, 86, 0.16), transparent);
        box-shadow: 0 10px 18px rgba(24, 44, 49, 0.18);
        transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      }

      .search-form button:hover,
      .search-form button:focus-visible,
      .footer-home-button:hover,
      .footer-home-button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(24, 44, 49, 0.24);
        outline: none;
      }

      .search-feedback,
      .search-hint {
        min-height: 1.5em;
        margin: 12px 0 0;
        font-size: 0.95rem;
      }

      .search-feedback {
        color: #5e4d3a;
      }

      .search-feedback.is-error {
        color: #8f392c;
      }

      .search-feedback.is-warning {
        color: #7a5b22;
      }

      .search-hint {
        color: #7c6540;
        opacity: 0.9;
      }

      .notice-card,
      .watch-card {
        min-height: 240px;
      }

      .notice-text,
      .record-paragraphs p,
      .directory-copy p {
        margin: 14px 0 0;
        color: var(--ink-soft);
      }

      .record-content-grid {
        display: grid;
        gap: 22px 28px;
        margin-top: 18px;
      }

      .record-content-grid.has-media {
        display: block;
      }

      .record-content-grid.has-media::after {
        content: "";
        display: table;
        clear: both;
      }

      .record-content-grid.has-media .record-media {
        float: left;
        width: min(340px, 45%);
        margin: 0 24px 16px 0;
      }

      .record-content-grid.has-media .record-paragraphs {
        display: block;
      }

      .record-content-grid.has-media .record-paragraphs p {
        margin: 0 0 14px 0;
      }

      .watch-list {
        display: grid;
        gap: 12px;
        margin: 18px 0 0;
      }

      .watch-list div {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 12px;
        border-bottom: 1px dashed rgba(123, 97, 53, 0.18);
      }

      .watch-list dt {
        color: #735a36;
      }

      .watch-list dd {
        margin: 0;
        color: var(--ink);
        font-weight: 600;
      }

      .directory-section {
        margin-top: 24px;
      }

      .directory-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .directory-card {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        min-height: 168px;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .directory-card:hover,
      .directory-card:focus-within {
        transform: translateY(-2px);
        box-shadow: var(--shadow);
      }

      .directory-badge {
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        flex: none;
        border: 1px solid rgba(176, 142, 83, 0.24);
        border-radius: 50%;
        color: #7a5d35;
        background: rgba(255, 251, 243, 0.78);
        font-family: "STKaiti", "KaiTi", serif;
        font-size: 1.06rem;
      }

      .directory-copy span {
        display: inline-flex;
        margin-top: 14px;
        padding: 6px 12px;
        border-radius: 999px;
        color: #835f2f;
        background: rgba(185, 147, 82, 0.12);
        font-size: 0.9rem;
      }

      .archive-overlay {
        position: fixed;
        inset: 0;
        z-index: 55;
        overflow-y: auto;
        padding: 32px 20px;
        background: rgba(10, 21, 24, 0.56);
        backdrop-filter: blur(8px);
      }

      .archive-panel {
        width: min(100%, 1120px);
        margin: 0 auto;
        border: 1px solid rgba(186, 149, 87, 0.22);
        border-radius: 30px;
        background:
          linear-gradient(180deg, rgba(251, 246, 235, 0.96), rgba(243, 233, 214, 0.98)),
          linear-gradient(120deg, rgba(185, 147, 82, 0.08), transparent 52%);
        box-shadow: 0 28px 60px rgba(17, 28, 31, 0.28);
      }

      .archive-header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        padding: 28px 30px 18px;
      }

      .archive-header-copy h2 {
        margin: 0;
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: clamp(1.9rem, 3.2vw, 2.5rem);
        letter-spacing: 0.08em;
      }

      .archive-intro {
        margin: 12px 0 0;
        max-width: 760px;
        color: var(--ink-soft);
      }

      .archive-close {
        flex: none;
        width: 44px;
        height: 44px;
        border: 1px solid rgba(155, 118, 53, 0.26);
        border-radius: 50%;
        color: #6b4d22;
        background: rgba(255, 252, 245, 0.88);
        font-size: 1.25rem;
        line-height: 1;
      }

      .archive-body {
        padding: 0 24px 24px;
      }

      .archive-list {
        display: grid;
        gap: 14px;
      }

      .disciple-entry {
        position: relative;
        border: 1px solid rgba(130, 102, 58, 0.16);
        border-radius: 22px;
        background: rgba(255, 251, 243, 0.72);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }

      .disciple-entry.is-active {
        border-color: rgba(165, 126, 59, 0.32);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          0 12px 28px rgba(40, 36, 29, 0.08);
      }

      .disciple-entry.is-removed {
        border-style: dashed;
      }

      .disciple-stamp {
        position: absolute;
        top: 18px;
        right: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 94px;
        height: 42px;
        border: 2px solid rgba(146, 53, 40, 0.62);
        border-radius: 999px;
        color: rgba(146, 53, 40, 0.9);
        background: rgba(255, 246, 244, 0.48);
        box-shadow: inset 0 0 0 2px rgba(146, 53, 40, 0.12);
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: 1rem;
        letter-spacing: 0.14em;
        transform: rotate(-12deg);
        pointer-events: none;
      }

      .disciple-toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 18px 22px;
        border: 0;
        color: inherit;
        text-align: left;
        background: transparent;
      }

      .disciple-entry.has-stamp .disciple-toggle {
        padding-right: 126px;
      }

      .disciple-toggle-main {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .disciple-name {
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: 1.32rem;
        letter-spacing: 0.05em;
      }

      .disciple-court {
        color: #7d6342;
        font-size: 0.94rem;
      }

      .disciple-toggle-side {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #8c6b39;
        font-size: 0.92rem;
        white-space: nowrap;
      }

      .disciple-arrow {
        font-size: 1.1rem;
        transition: transform 180ms ease;
      }

      .disciple-entry.is-active .disciple-arrow {
        transform: rotate(90deg);
      }

      .disciple-detail {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr);
        gap: 20px;
        padding: 0 22px 22px;
      }

      .disciple-portrait {
        overflow: hidden;
        border: 1px solid rgba(170, 132, 73, 0.18);
        border-radius: 20px;
        background: rgba(255, 253, 248, 0.88);
        box-shadow: var(--shadow-soft);
      }

      .disciple-portrait img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
      }

      .disciple-copy {
        padding-top: 4px;
      }

      .disciple-copy p {
        margin: 0 0 12px;
        color: var(--ink-soft);
      }

      .disciple-note {
        margin: 0;
        padding: 12px 14px;
        border-left: 3px solid rgba(171, 130, 60, 0.5);
        border-radius: 0 14px 14px 0;
        color: #59452e;
        background: rgba(189, 151, 83, 0.08);
      }

      .record-shell {
        display: grid;
        gap: 22px;
      }

      .record-header h1 {
        font-size: clamp(2rem, 4vw, 3.5rem);
      }

      .record-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        margin-top: 14px;
        color: #6b5947;
      }

      .record-body {
        padding-bottom: 30px;
      }

      .record-paragraphs {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }

      .record-selection-secret {
        color: transparent !important;
        cursor: text;
        user-select: text;
      }

      .record-selection-secret::selection {
        color: #a52d27;
        background: rgba(190, 145, 91, 0.34);
      }

      .record-selection-secret::-moz-selection {
        color: #a52d27;
        background: rgba(190, 145, 91, 0.34);
      }

      .record-media {
        margin-top: 22px;
      }

      .record-figure {
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(170, 132, 73, 0.18);
        border-radius: 22px;
        background: rgba(255, 252, 245, 0.9);
        box-shadow: var(--shadow-soft);
      }

      .record-figure img {
        display: block;
        width: 100%;
        max-height: 540px;
        object-fit: cover;
      }

      .record-content-grid.has-media .record-figure img {
        max-height: none;
        height: auto;
        object-fit: contain;
      }

      .record-figure.is-contain {
        background: #f9f3e4;
      }

      .record-figure.is-contain img {
        max-height: none;
        object-fit: contain;
      }

      .record-figure figcaption {
        padding: 12px 16px 14px;
        color: #6b5947;
        font-size: 0.94rem;
        border-top: 1px solid rgba(170, 132, 73, 0.14);
        background: rgba(252, 247, 237, 0.76);
      }

      .site-footer {
        padding: 0 0 32px;
      }

      .footer-inner {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 22px;
        border: 1px solid rgba(126, 100, 58, 0.18);
        border-radius: 24px;
        background:
          linear-gradient(180deg, rgba(251, 246, 235, 0.84), rgba(242, 233, 215, 0.92)),
          linear-gradient(120deg, rgba(189, 151, 83, 0.1), transparent 46%);
        box-shadow: var(--shadow-soft);
      }

      .footer-note {
        margin: 0;
        color: #7a5f39;
        font-family: "STKaiti", "KaiTi", "Noto Serif SC", serif;
        font-size: 1.05rem;
      }

      .footer-status {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 12px;
      }

      .footer-pill {
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        min-width: 160px;
        padding: 10px 14px;
        border: 1px solid rgba(176, 142, 83, 0.18);
        border-radius: 18px;
        color: #664f34;
        background: rgba(255, 251, 243, 0.68);
      }

      .footer-pill strong {
        color: var(--ink);
      }

      .footer-pill.is-muted {
        min-width: 228px;
      }

      .toast-region {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 40;
      }

      .toast {
        padding: 12px 16px;
        border: 1px solid rgba(176, 142, 83, 0.18);
        border-radius: 16px;
        color: #f8f1e5;
        background: rgba(20, 44, 49, 0.92);
        box-shadow: 0 16px 30px rgba(18, 32, 36, 0.22);
      }

      .noscript-banner {
        width: min(calc(100% - 32px), 640px);
        margin: 16px auto 32px;
        padding: 16px 18px;
        border: 1px solid rgba(155, 118, 53, 0.24);
        border-radius: 16px;
        color: #6c4f25;
        background: rgba(255, 249, 238, 0.94);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes panel-fade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1240px) {
        .directory-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 1080px) {
        .hero-grid,
        .content-grid {
          grid-template-columns: 1fr;
        }

        .hero-card,
        .protocol-card,
        .notice-card,
        .watch-card {
          min-height: auto;
        }

        .disciple-detail {
          grid-template-columns: 170px minmax(0, 1fr);
        }
      }

      @media (max-width: 760px) {
        .header-inner,
        .app-shell,
        .footer-inner {
          width: min(calc(100% - 24px), var(--content-width));
        }

        .header-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .site-nav {
          justify-content: flex-start;
        }

        .paper-panel {
          padding: 22px;
          border-radius: 22px;
        }

        .search-form {
          flex-direction: column;
        }

        .search-form button,
        .footer-home-button {
          width: 100%;
        }

        .directory-grid {
          grid-template-columns: 1fr;
        }

        .footer-status {
          width: 100%;
          justify-content: stretch;
        }

        .footer-pill {
          width: 100%;
        }

        .record-content-grid.has-media {
          display: block;
        }

        .record-content-grid.has-media .record-media {
          float: none;
          width: 100%;
          margin: 0 0 18px 0;
        }

        .record-content-grid.has-media .record-figure img {
          max-height: 520px;
        }

        .archive-overlay {
          padding: 18px 12px;
        }

        .archive-header {
          padding: 22px 20px 14px;
        }

        .archive-body {
          padding: 0 16px 16px;
        }

        .disciple-toggle {
          flex-direction: column;
          align-items: flex-start;
        }

        .disciple-entry.has-stamp .disciple-toggle {
          padding-right: 22px;
          padding-top: 70px;
        }

        .disciple-stamp {
          top: 14px;
          right: 18px;
        }

        .disciple-toggle-side {
          white-space: normal;
        }

        .disciple-detail {
          grid-template-columns: 1fr;
          padding: 0 18px 18px;
        }

        .disciple-portrait {
          max-width: 240px;
        }
      }
    </style>
